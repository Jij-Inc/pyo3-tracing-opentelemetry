[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "example-module"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "maturin>=1.14.1,<2.0",
    "syrupy>=5.3.2",
    "pyright>=1.1.410",
]

[tool.maturin]
features = ["pyo3/extension-module"]
